name: Build & release (Windows)

# Sin pasos manuales: empuja un tag y GitHub compila y publica los dos formatos.
#   git tag v2.7.0 && git push origin v2.7.0
# Resultado en la Release:
#   - Miraru-Portable.exe  → descargar y doble clic (sin instalar, sin Python)
#   - Miraru-Setup.exe     → instalador con accesos directos
# O lánzalo a mano desde "Actions" (workflow_dispatch) para bajar los .exe como artefactos.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read      # SignPath descarga los artefactos a firmar

jobs:
  # No se publica nada si la app no arranca con la política del Control inteligente
  # de aplicaciones de Windows (instalación con install.ps1).
  smart-app-control:
    uses: ./.github/workflows/sac.yml

  build-windows:
    needs: smart-app-control
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # ── Compilación en dos fases ─────────────────────────────────────────────
      # El instalador lleva dentro AnimeTracker.exe: si hay firma con SignPath, se
      # firma la app ANTES de empaquetarla (si no, el .exe instalado iría sin firma).
      # build.py borra dist/ entero en cada compilación: cada .exe se aparta a release/.
      - name: Compilar la app (dist/AnimeTracker)
        run: python build.py --solo-app

      - name: ¿Está configurado SignPath?
        id: sp
        shell: bash
        run: |
          if [ -n "${{ secrets.SIGNPATH_API_TOKEN }}" ] && [ -n "${{ vars.SIGNPATH_ORGANIZATION_ID }}" ]; then
            echo "firmar=true" >> "$GITHUB_OUTPUT"
          else
            echo "firmar=false" >> "$GITHUB_OUTPUT"
            echo "SignPath sin configurar: se publican los .exe sin firma (ver packaging/FIRMA.md)."
          fi

      - name: Subir AnimeTracker.exe para firmar
        if: steps.sp.outputs.firmar == 'true'
        id: app-sin-firmar
        uses: actions/upload-artifact@v4
        with:
          name: app-sin-firmar
          path: dist/AnimeTracker/AnimeTracker.exe
          if-no-files-found: error

      - name: Firmar AnimeTracker.exe (SignPath)
        if: steps.sp.outputs.firmar == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'miraru' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.app-sin-firmar.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: firmado-app

      - name: Usar la app firmada
        if: steps.sp.outputs.firmar == 'true'
        run: Copy-Item firmado-app/AnimeTracker.exe dist/AnimeTracker/AnimeTracker.exe -Force

      - name: Compilar el instalador
        run: |
          python build.py --solo-instalador
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/AnimeTracker-Setup.exe release/Miraru-Setup.exe

      - name: Compilar el portable (un único .exe)
        run: |
          python build.py --portable
          Copy-Item dist/Miraru-Portable.exe release/Miraru-Portable.exe

      - name: Subir instalador y portable para firmar
        if: steps.sp.outputs.firmar == 'true'
        id: exes-sin-firmar
        uses: actions/upload-artifact@v4
        with:
          name: exes-sin-firmar
          path: |
            release/Miraru-Setup.exe
            release/Miraru-Portable.exe
          if-no-files-found: error

      - name: Firmar instalador y portable (SignPath)
        if: steps.sp.outputs.firmar == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'miraru' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: instaladores
          github-artifact-id: ${{ steps.exes-sin-firmar.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: firmado-exes

      - name: Usar los .exe firmados
        if: steps.sp.outputs.firmar == 'true'
        run: |
          Copy-Item firmado-exes/Miraru-Setup.exe release/Miraru-Setup.exe -Force
          Copy-Item firmado-exes/Miraru-Portable.exe release/Miraru-Portable.exe -Force
          Get-AuthenticodeSignature release/*.exe | Format-Table Status, Path -AutoSize

      # ── Firma con certificado propio (.pfx, alternativa a SignPath) ─────────
      # Sin firmar, Windows muestra SmartScreen ("editor desconocido"), que es lo
      # que más frena a quien instala. Este paso se SALTA solo si no hay
      # certificado configurado, así que el workflow sigue funcionando tal cual
      # hasta que decidas firmar. Para activarlo, añade en Settings → Secrets:
      #   WINDOWS_CERT_BASE64  → el .pfx codificado en base64
      #   WINDOWS_CERT_PASSWORD → su contraseña
      # (ver packaging/README.md para cómo obtener el certificado)
      - name: ¿Hay certificado de firma?
        id: cert
        shell: bash
        run: |
          if [ -n "${{ secrets.WINDOWS_CERT_BASE64 }}" ]; then
            echo "firmar=true" >> "$GITHUB_OUTPUT"
          else
            echo "firmar=false" >> "$GITHUB_OUTPUT"
            echo "Sin certificado: se publican los .exe sin firmar (SmartScreen avisará)."
          fi

      - name: Firmar los ejecutables
        if: steps.cert.outputs.firmar == 'true'
        shell: pwsh
        run: |
          # El .pfx nunca se escribe en el repo: solo en el runner, y se borra al terminar.
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String("${{ secrets.WINDOWS_CERT_BASE64 }}"))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
                      Sort-Object FullName -Descending | Select-Object -First 1
          foreach ($exe in @("release/Miraru-Setup.exe", "release/Miraru-Portable.exe")) {
            & $signtool.FullName sign `
              /f $pfx /p "${{ secrets.WINDOWS_CERT_PASSWORD }}" `
              /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
              /d "Miraru" $exe
            if ($LASTEXITCODE -ne 0) { throw "Fallo al firmar $exe" }
          }
          Remove-Item $pfx -Force
          # Comprobación: si la firma no valida, mejor fallar aquí que publicar
          foreach ($exe in @("release/Miraru-Setup.exe", "release/Miraru-Portable.exe")) {
            & $signtool.FullName verify /pa /v $exe
            if ($LASTEXITCODE -ne 0) { throw "Firma inválida en $exe" }
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Miraru-Windows
          path: |
            release/Miraru-Setup.exe
            release/Miraru-Portable.exe
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/Miraru-Setup.exe
            release/Miraru-Portable.exe
          body_path: packaging/signpath/notas-release.md
          generate_release_notes: true
