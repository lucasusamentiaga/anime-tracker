<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/static/icon.ico">
<title>Novedades — Miraru</title>
<style>
:root{--bg:#0f0f13;--card:#1a1a24;--border:#2a2a38;--fg:#e2e2e8;--muted:#6b6b88;
      --accent:#7c3aed;--light:#a78bfa;--success:#34d399;--danger:#f87171}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:"Segoe UI",system-ui,sans-serif;min-height:100vh}
header{background:var(--card);border-bottom:1px solid var(--border);padding:11px 20px;
       display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
header img{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid var(--accent)}
header h1{font-size:16px;font-weight:700;color:var(--light);flex:1}
/* v2.6.1: efecto neón en el título de la página (igual estética que el menú) */
header h1{
  text-shadow:
    0 0 4px rgba(183,148,255,.7),
    0 0 10px rgba(139,92,246,.45),
    0 0 22px rgba(124,58,237,.25),
    0 0 38px rgba(217,70,239,.18);
  animation:titleNeon 3.2s ease-in-out infinite alternate;
}
@keyframes titleNeon{
  from{text-shadow:0 0 4px rgba(183,148,255,.55),0 0 9px rgba(139,92,246,.35),0 0 18px rgba(124,58,237,.18),0 0 32px rgba(217,70,239,.12)}
  to  {text-shadow:0 0 6px rgba(183,148,255,.85),0 0 14px rgba(139,92,246,.6),0 0 28px rgba(124,58,237,.35),0 0 48px rgba(217,70,239,.25)}
}
@media (prefers-reduced-motion:reduce){header h1{animation:none}}
.back{background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--muted);
      padding:6px 14px;font-size:13px;text-decoration:none;display:inline-block}

.plat-bar{display:flex;gap:8px;padding:14px 20px;overflow-x:auto;border-bottom:1px solid var(--border);
          background:var(--card);scrollbar-width:none}
.plat-bar::-webkit-scrollbar{display:none}
.plat-btn{flex-shrink:0;display:flex;align-items:center;gap:6px;background:var(--bg);
          border:1px solid var(--border);border-radius:99px;color:var(--muted);
          padding:6px 14px;font-size:13px;cursor:pointer;transition:all .15s;font-weight:500}
.plat-btn.active{background:rgba(124,58,237,.15);border-color:var(--accent);color:var(--light)}
.plat-btn:hover{border-color:var(--accent);color:var(--fg)}

main{max-width:1100px;margin:0 auto;padding:20px}
.section-title{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;
               letter-spacing:.5px;margin-bottom:14px;margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-bottom:24px}

.card{background:var(--card);border:1px solid var(--border);border-radius:12px;
      overflow:hidden;cursor:pointer;transition:border-color .18s ease,box-shadow .18s ease}
.card:hover{border-color:var(--accent);box-shadow:0 4px 16px rgba(0,0,0,.2)}
.card .thumb{position:relative;aspect-ratio:3/4}
.card .thumb img{width:100%;height:100%;object-fit:cover}
.card .score{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.75);
             color:#fbbf24;font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px}
.card .plats{position:absolute;bottom:0;inset-x:0;background:linear-gradient(transparent,rgba(0,0,0,.9));
             padding:6px 8px 5px;display:flex;gap:3px;flex-wrap:wrap}
.plat-tag{font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;text-transform:uppercase}
.pt-cr{background:#f47521;color:#fff}.pt-nf{background:#e50914;color:#fff}
.pt-am{background:#00a8e1;color:#fff}.pt-dp{background:#006e99;color:#fff}.pt-ot{background:#444;color:#fff}
.card .info{padding:8px 10px 10px}
.card .title{font-size:12px;font-weight:600;line-height:1.3;margin-bottom:4px;
             display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .genres{display:flex;flex-wrap:wrap;gap:3px}
.genre-tag{font-size:10px;color:var(--light);background:rgba(124,58,237,.1);
           border:1px solid rgba(124,58,237,.2);border-radius:4px;padding:1px 5px}
.next-ep{font-size:10px;color:var(--success);margin-top:4px;font-weight:600}

.add-btn{display:flex;align-items:center;justify-content:center;gap:4px;
         background:var(--accent);color:#fff;border:none;border-radius:6px;
         padding:5px 10px;font-size:11px;font-weight:600;cursor:pointer;
         margin-top:6px;width:100%;transition:background .18s ease}
.add-btn:hover{background:var(--accent2)}
.add-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.add-btn.added{background:#14342a;color:var(--success)}

.loading{text-align:center;padding:60px;color:var(--muted)}
.spin{width:24px;height:24px;border:3px solid rgba(124,58,237,.2);border-top-color:var(--accent);
      border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

.err-box{background:#1a0a0a;border:1px solid #5a2020;border-radius:10px;padding:16px;
         color:var(--danger);text-align:center;margin:20px 0;font-size:13px}

/* ── Noticias (RSS) ── */
.news-card{display:flex;gap:14px;background:var(--card);border:1px solid var(--border);
           border-radius:12px;padding:12px;text-decoration:none;color:inherit;
           transition:border-color .18s ease,box-shadow .18s ease}
.news-card:hover{border-color:var(--accent);box-shadow:0 4px 16px rgba(0,0,0,.2)}
.news-card img{width:120px;height:76px;object-fit:cover;border-radius:8px;flex-shrink:0;
               background:var(--card2)}
.news-meta{font-size:10px;color:var(--muted);margin-bottom:4px}
.news-src{color:var(--light);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.news-title{font-size:14px;font-weight:600;line-height:1.35;margin-bottom:4px;
            display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.news-sum{font-size:12px;color:var(--muted);line-height:1.5;
          display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media (max-width:560px){.news-card img{width:84px;height:60px}}
[data-theme=light] .news-card{background:#fff;border-color:#d4d0ec}

/* Toast */
#toast{position:fixed;top:16px;right:16px;z-index:100;opacity:0;pointer-events:none;
       transition:opacity .3s;max-width:280px}
#toast.show{opacity:1}
.toast-i{background:var(--card);border:1px solid #1d6b50;border-radius:10px;
          padding:10px 14px;font-size:13px;font-weight:500;color:var(--success)}
.toast-i.err{border-color:#5a2020;color:var(--danger)}


/* Twitter/X floating button */
#tw-btn{
  position:fixed;bottom:20px;right:20px;z-index:50;
  background:#000;color:#fff;border:none;border-radius:50%;
  width:40px;height:40px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 12px rgba(0,0,0,.4);
  transition:opacity .18s ease,box-shadow .18s ease;text-decoration:none;
  opacity:0.85;
}
#tw-btn:hover{opacity:1;box-shadow:0 4px 16px rgba(0,0,0,.4)}
#tw-btn svg{flex-shrink:0}
[data-theme=light]{
  --bg:#f8f7fc;--card:#fff;--border:#d4d0ec;--fg:#1e1e2e;--muted:#64648c;
  --light:#4f46e5;--accent:#4f46e5;--card2:#f0eef8;
  --success:#059669;--danger:#dc2626;--warn:#d97706;
}
[data-theme=light] header{background:#fff;border-color:#d4d0ec}
[data-theme=light] .back{background:#fff;border-color:#d4d0ec;color:#4b4b6b}
[data-theme=light] .back:hover{border-color:#4f46e5;color:#4338ca}
[data-theme=light] body{background:var(--bg);color:var(--fg)}
[data-theme=light] .plat-btn{background:#fff;color:#4b4b6b;border-color:#d4d0ec}
[data-theme=light] .plat-btn.active{background:#eef2ff;color:#4338ca;border-color:#c7d2fe}
[data-theme=light] .card{background:#fff;border-color:#d4d0ec}
[data-theme=light] .genre-tag{background:#eef2ff;color:#4338ca}
</style>
<!-- Sistema visual unificado (theme.css) -->
<link rel="stylesheet" href="/static/theme.css">
<script src="/static/customize.js"></script>
<script src="/static/i18n-dom.js" defer></script>
</head>
<body>

<div id="toast"><div class="toast-i" id="toast-i"></div></div>

<header>
  <img src="/static/logo.png" alt="logo" onerror="this.style.display='none'">
  <h1>🎬 Novedades</h1>
  <a href="/app" class="back">← Volver a mi lista</a>
</header>

<div class="plat-bar">
  <button class="plat-btn active" data-p="all"         onclick="cargar('all',this)">🌐 Todas</button>
  <button class="plat-btn"        data-p="crunchyroll" onclick="cargar('crunchyroll',this)">🟠 Crunchyroll</button>
  <button class="plat-btn"        data-p="netflix"     onclick="cargar('netflix',this)">🔴 Netflix</button>
  <button class="plat-btn"        data-p="amazon"      onclick="cargar('amazon',this)">🔵 Amazon</button>
  <button class="plat-btn"        data-p="disney"      onclick="cargar('disney',this)">🔵 Disney+</button>
  <span style="flex:1"></span>
  <button class="plat-btn" id="btn-noticias" onclick="cargarNoticias(this)"
          title="Noticias de Kudasai, Crunchyroll y Anime News Network">📰 Noticias</button>
</div>

<main>
  <div id="container">
    <div class="loading"><div class="spin"></div>Cargando novedades…</div>
  </div>
</main>

<script>
// ── Control de peticiones en vuelo ────────────────────────────────────────────
// Novedades y Noticias escriben en el MISMO contenedor. init() lanza cargar('all')
// nada más abrir la página, y esa petición puede tardar (AniList, con reintentos).
// Si pulsabas "Noticias" mientras seguía en vuelo, las noticias se pintaban y
// acto seguido la respuesta tardía de novedades las machacaba con su "Sin
// resultados" — parecía que el botón de Noticias mostrase el filtro de plataformas.
// Cada carga toma un número; solo la más reciente tiene permiso para pintar.
function _thumbUrl(url) { return url ? url.replace('/cover/large/', '/cover/medium/') : ''; }
let PETICION = 0;

function nuevaPeticion() { return ++PETICION; }
function esVigente(id)   { return id === PETICION; }

// Aviso cuando los datos vienen de una fuente de respaldo (AniList caído).
function pintarAviso(cont, texto) {
  if (!texto) return;
  const av = document.createElement('div');
  av.className = 'err-box';
  av.style.cssText = 'opacity:.85;margin-bottom:12px';
  av.textContent = 'ℹ️ ' + texto;
  cont.appendChild(av);
}

// ── Noticias (RSS: Kudasai + Crunchyroll + Anime News Network) ────────────────
function _hace(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return '';
  const min = Math.round((Date.now() - d.getTime()) / 60000);
  if (min < 1)    return 'ahora mismo';
  if (min < 60)   return `hace ${min} min`;
  const h = Math.round(min / 60);
  if (h < 24)     return `hace ${h} h`;
  const dias = Math.round(h / 24);
  if (dias === 1) return 'ayer';
  if (dias < 30)  return `hace ${dias} días`;
  return d.toLocaleDateString();
}

async function cargarNoticias(btn) {
  const mia = nuevaPeticion();
  document.querySelectorAll('.plat-btn').forEach(b => b.classList.toggle('active', b === btn));
  const cont = document.getElementById('container');
  cont.innerHTML = '<div class="loading"><div class="spin"></div>Cargando noticias…</div>';
  try {
    const r = await fetch('/api/noticias');
    if (!esVigente(mia)) return;
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    if (!esVigente(mia)) return;
    const items = d.noticias || [];
    cont.innerHTML = '';

    if (!items.length) {
      const vacio = document.createElement('div');
      vacio.className = 'err-box';
      vacio.textContent = 'No se pudieron cargar las noticias. ¿Tienes conexión a internet?';
      cont.appendChild(vacio);
      return;
    }

    const titulo = document.createElement('div');
    titulo.className = 'section-title';
    titulo.textContent = 'Últimas noticias · ' + (d.fuentes || []).join(' · ');
    cont.appendChild(titulo);

    const lista = document.createElement('div');
    lista.style.cssText = 'display:flex;flex-direction:column;gap:10px';

    items.forEach(n => {
      // <a> real: permite abrir en pestaña nueva, copiar enlace, etc.
      const card = document.createElement('a');
      card.href = n.link || '#';
      card.target = '_blank';
      card.rel = 'noopener noreferrer';
      card.className = 'news-card';

      if (n.imagen) {
        const img = document.createElement('img');
        img.src = _thumbUrl(n.imagen); img.alt = ''; img.loading = 'lazy';
        img.onerror = () => img.remove();
        card.appendChild(img);
      }

      const info = document.createElement('div');
      info.style.cssText = 'flex:1;min-width:0';

      const meta = document.createElement('div');
      meta.className = 'news-meta';
      const fuente = document.createElement('span');
      fuente.className = 'news-src';
      fuente.textContent = n.fuente || '';
      meta.appendChild(fuente);
      const cuando = _hace(n.fecha);
      if (cuando) {
        const t = document.createElement('span');
        t.textContent = ' · ' + cuando;
        meta.appendChild(t);
      }

      const h = document.createElement('div');
      h.className = 'news-title';
      h.textContent = n.titulo;                    // textContent = sin riesgo de HTML inyectado

      info.appendChild(meta);
      info.appendChild(h);
      if (n.resumen) {
        const p = document.createElement('div');
        p.className = 'news-sum';
        p.textContent = n.resumen;
        info.appendChild(p);
      }
      card.appendChild(info);
      lista.appendChild(card);
    });
    cont.appendChild(lista);
  } catch (e) {
    if (!esVigente(mia)) return;
    cont.innerHTML = '';
    const eb = document.createElement('div');
    eb.className = 'err-box';
    eb.textContent = 'Error al cargar noticias: ' + (e.message || '');
    cont.appendChild(eb);
  }
}

let LISTA_LOCAL = new Set(); // nombres ya en la lista del usuario
let TR = {};

async function init() {
  try {
    const [langR, animesR] = await Promise.all([fetch('/api/lang'), fetch('/api/animes/slim')]);
    const langD   = await langR.json();
    const animesD = await animesR.json();
    TR = langD.translations || {};
    LISTA_LOCAL = new Set((animesD.animes||[]).map(a => a.nombre.toLowerCase()));
  } catch(_) {}
  // Por [data-p="all"] y no por '.plat-btn': querySelector devuelve el primero
  // con esa clase, así que reordenar la barra rompería el botón que se marca.
  cargar('all', document.querySelector('.plat-btn[data-p="all"]'));
}

function toast(msg, tipo='ok') {
  const el = document.getElementById('toast');
  const i  = document.getElementById('toast-i');
  i.className = 'toast-i' + (tipo === 'err' ? ' err' : '');
  i.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 3000);
}

function platColor(p) {
  const m = {
    'Crunchyroll':'pt-cr','Netflix':'pt-nf',
    'Amazon Prime Video':'pt-am','Disney Plus':'pt-dp',
    'Disney+':'pt-dp',
  };
  return m[p] || 'pt-ot';
}

function nextEpText(next) {
  if (!next) return '';
  const d = new Date(next.airingAt * 1000);
  const now = Date.now();
  const diff = d - now;
  if (diff < 0) return `Ep ${next.episode} ya disponible`;
  const hrs = Math.floor(diff / 3600000);
  if (hrs < 24) return `Ep ${next.episode} en ${hrs}h`;
  const days = Math.floor(hrs / 24);
  return `Ep ${next.episode} en ${days}d`;
}

async function cargar(plat, btn) {
  const mia = nuevaPeticion();
  document.querySelectorAll('.plat-btn').forEach(b => b.classList.toggle('active', b === btn));
  const cont = document.getElementById('container');
  cont.innerHTML = '<div class="loading"><div class="spin"></div>Cargando…</div>';

  try {
    const r = await fetch(`/api/novedades?plataforma=${encodeURIComponent(plat)}`);
    const d = await r.json();
    if (!esVigente(mia)) return;

    if (d.error) {
      const eb = document.createElement('div');
      eb.className = 'err-box';
      eb.textContent = 'Error al cargar: ' + (d.error || 'desconocido');
      cont.innerHTML = '';
      cont.appendChild(eb);
      return;
    }
    const items = d.novedades || [];
    if (!items.length) {
      cont.innerHTML = '';
      const empty = document.createElement('div');
      empty.className = 'loading';
      // Si el backend explica por qué no hay nada, decirlo tal cual en vez de
      // insinuar que el problema es la conexión del usuario.
      empty.textContent = d.aviso
        ? d.aviso
        : (plat === 'all'
            ? 'No hay novedades disponibles ahora mismo. Vuelve a intentarlo en un rato.'
            : 'Ningún estreno en esta plataforma. Prueba con "Todas".');
      cont.appendChild(empty);
      return;
    }
    const frag = document.createDocumentFragment();
    const nowSec = Date.now() / 1000;

    // "Próximamente" = tienen episodio programado en los próximos 7 días
    const proximamente = items.filter(a =>
      a.proximo_ep &&
      a.proximo_ep.airingAt > nowSec &&
      a.proximo_ep.airingAt < nowSec + 7 * 86400
    );

    // "En emisión ahora" = todos los demás (ya emitidos o sin fecha próxima)
    const enEmision = items.filter(a => !proximamente.includes(a));

    // Sección "Próximamente" (ordenada por cuándo airan)
    if (proximamente.length) {
      proximamente.sort((a, b) => (a.proximo_ep?.airingAt || 0) - (b.proximo_ep?.airingAt || 0));
      const tP = document.createElement('p');
      tP.className = 'section-title';
      tP.textContent = '🔔 Próximamente — esta semana';
      frag.appendChild(tP);
      const gP = document.createElement('div');
      gP.className = 'grid';
      proximamente.forEach(a => gP.appendChild(makeCard(a)));
      frag.appendChild(gP);
    }

    // Sección "En emisión ahora" (ordenada por puntuación)
    if (enEmision.length) {
      const tE = document.createElement('p');
      tE.className = 'section-title';
      tE.textContent = '📺 En emisión ahora';
      frag.appendChild(tE);
      const gE = document.createElement('div');
      gE.className = 'grid';
      enEmision.forEach(a => gE.appendChild(makeCard(a)));
      frag.appendChild(gE);
    }

    cont.innerHTML = '';
    pintarAviso(cont, d.aviso);      // después de limpiar, o se borraría
    cont.appendChild(frag);

  } catch(e) {
    if (!esVigente(mia)) return;
    const eb = document.createElement('div');
    eb.className = 'err-box';
    eb.textContent = 'Error de conexión: ' + (e.message || '');
    cont.innerHTML = '';
    cont.appendChild(eb);
  }
}

function makeCard(a) {
  const BLANK = "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1 1'><rect fill='%231a1a24' width='1' height='1'/></svg>";
  const yaEnLista = LISTA_LOCAL.has((a.nombre||'').toLowerCase());

  const card = document.createElement('div');
  card.className = 'card';

  const thumb = document.createElement('div');
  thumb.className = 'thumb';

  const img = document.createElement('img');
  img.loading = 'lazy';
  img.src = _thumbUrl(a.imagen) || BLANK;
  img.onerror = () => { img.src = BLANK; };
  thumb.appendChild(img);

  if (a.puntuacion && a.puntuacion > 0) {
    const sc = document.createElement('div');
    sc.className = 'score';
    sc.textContent = '⭐ ' + a.puntuacion.toFixed(1);
    thumb.appendChild(sc);
  }

  const platsDiv = document.createElement('div');
  platsDiv.className = 'plats';
  (a.plataformas||[]).forEach(p => {
    const t = document.createElement('span');
    t.className = 'plat-tag ' + platColor(p);
    t.textContent = p.replace('Amazon Prime Video','Amazon').replace('Disney Plus','Disney+').substring(0,10);
    platsDiv.appendChild(t);
  });
  thumb.appendChild(platsDiv);
  card.appendChild(thumb);

  const info = document.createElement('div');
  info.className = 'info';

  const title = document.createElement('div');
  title.className = 'title';
  title.textContent = a.nombre;
  info.appendChild(title);

  const genres = document.createElement('div');
  genres.className = 'genres';
  (a.generos||[]).slice(0,3).forEach(g => {
    const span = document.createElement('span');
    span.className = 'genre-tag';
    span.textContent = g;
    genres.appendChild(span);
  });
  info.appendChild(genres);

  const nxt = nextEpText(a.proximo_ep);
  if (nxt) {
    const ne = document.createElement('div');
    ne.className = 'next-ep';
    ne.textContent = '⏰ ' + nxt;
    info.appendChild(ne);
  }

  const addBtn = document.createElement('button');
  addBtn.className = 'add-btn' + (yaEnLista ? ' added' : '');
  addBtn.textContent = yaEnLista ? '✓ En mi lista' : '+ Añadir';
  if (!yaEnLista) {
    addBtn.addEventListener('click', async () => {
      addBtn.disabled = true;
      addBtn.textContent = '…';
      try {
        const r = await fetch('/api/animes', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({nombre: a.nombre, fuente: 'anilist'})
        });
        const d = await r.json();
        if (r.status === 409) { toast('Ya en tu lista', 'ok'); }
        else if (!r.ok) { toast('Error al añadir', 'err'); addBtn.disabled = false; addBtn.textContent = '+ Añadir'; return; }
        else { toast('✓ ' + a.nombre + ' añadido'); }
        addBtn.className = 'add-btn added';
        addBtn.textContent = '✓ En mi lista';
        LISTA_LOCAL.add(a.nombre.toLowerCase());
      } catch(_) { toast('Error de conexión', 'err'); addBtn.disabled = false; addBtn.textContent = '+ Añadir'; }
    });
  }
  info.appendChild(addBtn);
  card.appendChild(info);
  return card;
}

init();
