<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anime Tracker — Setup</title>
<style>
:root{--bg:#0f0f13;--card:#1a1a24;--border:#2a2a38;--fg:#e2e2e8;--muted:#6b6b88;--accent:#7c3aed;--light:#a78bfa}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:"Segoe UI",system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.wizard{width:100%;max-width:640px}
.header{text-align:center;margin-bottom:20px;opacity:0;animation:fadeUp .8s .1s ease forwards}
.header img{width:76px;height:76px;border-radius:50%;object-fit:cover;border:3px solid var(--accent);margin-bottom:10px}
.header h1{font-size:22px;font-weight:700;color:var(--light)}
.header p{color:var(--muted);font-size:13px;margin-top:4px}
.lang-bar{display:flex;justify-content:center;gap:8px;margin-bottom:14px;opacity:0;animation:fadeUp .8s .2s ease forwards}
.lang-btn{background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--muted);padding:5px 13px;font-size:13px;cursor:pointer;transition:all .15s}
.lang-btn.active,.lang-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.steps-bar{display:flex;gap:4px;margin-bottom:18px;opacity:0;animation:fadeUp .8s .3s ease forwards}
.steps-bar .s{flex:1;height:4px;background:#252535;border-radius:2px;transition:background .3s}
.steps-bar .s.done{background:var(--accent)}.steps-bar .s.active{background:var(--light)}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:26px;opacity:0;animation:fadeUp .8s .35s ease forwards}
.step{display:none}.step.active{display:block}
h2{font-size:17px;font-weight:600;margin-bottom:4px}
.sub{color:var(--muted);font-size:13px;margin-bottom:18px;line-height:1.6}
.inst{background:#12121a;border:1px solid var(--border);border-radius:10px;padding:13px 15px;margin-bottom:10px;display:flex;gap:10px;align-items:flex-start}
.inst .n{flex-shrink:0;width:22px;height:22px;border-radius:50%;background:#3d2d70;color:var(--light);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.inst p{font-size:13px;line-height:1.7;color:#c4c4d8}
.inst a{color:var(--light);text-decoration:none}.inst a:hover{text-decoration:underline}
.inst code{background:#252535;border-radius:4px;padding:1px 5px;font-family:monospace;font-size:12px}
.inst strong{color:#e2e2e8}
.iw{display:inline;opacity:0;transform:translateY(6px);transition:none}
.hl{background:#1e1a30;border:1px solid #3d2d70;border-radius:10px;padding:11px 14px;margin:12px 0;font-size:13px;color:#c4b5fd}
.hl strong{color:var(--light)}
.email-box{background:#12121a;border:1px solid #3d2d70;border-radius:8px;padding:8px 13px;font-family:monospace;font-size:13px;color:#c4b5fd;word-break:break-all;margin:10px 0;user-select:all}
.drop{border:2px dashed #3a3a50;border-radius:12px;padding:24px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s;margin-top:6px}
.drop:hover,.drop.over{border-color:var(--accent);background:#1e1a30}
.drop .icon{font-size:24px;margin-bottom:6px}
.drop p{color:var(--muted);font-size:13px}
.drop p span{color:var(--light)}
.drop.ok{border-color:#059669;background:#0a1f18}.drop.ok p{color:#34d399}
label.lbl{display:block;font-size:12px;color:#a0a0b8;margin-bottom:4px;margin-top:12px}
input[type=text]{width:100%;background:#12121a;border:1px solid #3a3a50;border-radius:8px;color:var(--fg);padding:9px 12px;font-size:14px}
input[type=text]:focus{outline:2px solid var(--accent);border-color:transparent}
.actions{display:flex;gap:8px;margin-top:18px;justify-content:flex-end}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;border:none;transition:opacity .15s}
.btn:hover{opacity:.85}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-p{background:var(--accent);color:#fff}.btn-g{background:#252535;color:#a0a0b8;border:1px solid #3a3a50}
.err{color:#f87171;font-size:13px;margin-top:6px;display:none}
.spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.done-icon{font-size:46px;text-align:center;margin:8px 0 14px}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

/* Light theme — readability overrides */
[data-theme=light]{
  --bg:#f8f7fc;--card:#fff;--border:#d4d0ec;--fg:#1e1e2e;--muted:#64648c;
  --light:#4f46e5;--accent:#4f46e5;--card2:#f0eef8;
  --success:#059669;--danger:#dc2626;--warn:#d97706;
}
[data-theme=light] header{background:#fff;border-color:#d4d0ec}
[data-theme=light] .back{background:#fff;border-color:#d4d0ec;color:#4b4b6b}
[data-theme=light] .back:hover{border-color:#4f46e5;color:#4338ca}
[data-theme=light] body{background:var(--bg);color:var(--fg)}
[data-theme=light] .card{background:#fff;border-color:#d4d0ec}
[data-theme=light] h2{color:#4f46e5}
[data-theme=light] .step{background:#f0eef8;border-color:#d4d0ec}
[data-theme=light] .drop{background:#f8f7fc;border-color:#c7d2fe;color:#4338ca}
[data-theme=light] .btn-g{background:#eef2ff;color:#4b4b6b;border-color:#d4d0ec}
[data-theme=light] code{background:#eef2ff;color:#4338ca}
</style>
<script>if(localStorage.getItem('theme')==='light')document.documentElement.dataset.theme='light';</script>
</head>
<body>
<div class="wizard">

  <div class="header">
    <img src="/static/logo.png" alt="logo" onerror="this.style.display='none'">
    <h1>Anime Tracker</h1>
    <p id="h-sub"></p>
  </div>

  <div class="lang-bar">
    <button class="lang-btn active" data-lang="es" onclick="setLang('es')">ES</button>
    <button class="lang-btn" data-lang="en"        onclick="setLang('en')">EN</button>
    <button class="lang-btn" data-lang="fr"        onclick="setLang('fr')">FR</button>
    <button class="lang-btn" data-lang="de"        onclick="setLang('de')">DE</button>
  </div>

  <div class="steps-bar">
    <div class="s active" id="b1"></div>
    <div class="s" id="b2"></div>
    <div class="s" id="b3"></div>
    <div class="s" id="b4"></div>
  </div>

  <div class="card">

    <!-- Pasos — contenido inyectado dinámicamente por JS -->
    <div class="step active" id="s1"></div>
    <div class="step" id="s2"></div>
    <div class="step" id="s3"></div>
    <div class="step" id="s4"></div>

    <div class="step" id="s-done">
      <div class="done-icon">✅</div>
      <h2 id="done-t" style="text-align:center"></h2>
      <p class="sub" id="done-s" style="text-align:center;margin-top:8px"></p>
      <div class="actions" style="justify-content:center;margin-top:20px">
        <a href="/app" class="btn btn-p" id="btn-goto"></a>
      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js"></script>

let LANG = 'es';
const T = k => (TX[LANG] || TX.es)[k] || '';

// ── Renderizar paso completo ──────────────────────────────────────────────────
function renderSteps() {
  // Paso 1
  document.getElementById('s1').innerHTML = `
    <h2>${T('s1t')}</h2>
    <p class="sub">${T('s1sub')}</p>
    <div class="inst" data-anim><div class="n">1</div><p>${T('s1i1')}</p></div>
    <div class="inst" data-anim><div class="n">2</div><p>${T('s1i2')}</p></div>
    <div class="inst" data-anim><div class="n">3</div><p>${T('s1i3')}</p></div>
    <div class="actions" style="flex-direction:column;align-items:stretch;gap:8px">
      <button class="btn btn-p" id="b1n" onclick="ir(2)">${T('next')}</button>
      <a href="/app" class="btn btn-g" style="justify-content:center;text-decoration:none;font-size:12px">${T('skip')}</a>
    </div>
    <p style="color:var(--muted);font-size:11px;margin-top:8px;text-align:center;line-height:1.5">${T('skip_note')}</p>`;

  // Paso 2
  document.getElementById('s2').innerHTML = `
    <h2>${T('s2t')}</h2>
    <p class="sub">${T('s2sub')}</p>
    <div class="inst" data-anim><div class="n">1</div><p>${T('s2i1')}</p></div>
    <div class="inst" data-anim><div class="n">2</div><p>${T('s2i2')}</p></div>
    <div class="inst" data-anim><div class="n">3</div><p>${T('s2i3')}</p></div>
    <div class="actions">
      <button class="btn btn-g" onclick="ir(1)">${T('back')}</button>
      <button class="btn btn-p" onclick="ir(3)">${T('next')}</button>
    </div>`;

  // Paso 3
  document.getElementById('s3').innerHTML = `
    <h2>${T('s3t')}</h2>
    <p class="sub">${T('s3sub')}</p>
    <div class="drop" id="drop" onclick="document.getElementById('fi').click()"
         ondragover="event.preventDefault();this.classList.add('over')"
         ondragleave="this.classList.remove('over')"
         ondrop="dropF(event)">
      <div class="icon">📄</div>
      <p><span id="drop-hint">${T('drop')}</span></p>
    </div>
    <input type="file" id="fi" accept=".json" style="display:none" onchange="subir(this.files[0])">
    <p class="err" id="e3"></p>
    <div class="hl">${T('s3note')}</div>
    <div class="actions">
      <button class="btn btn-g" onclick="ir(2)">${T('back')}</button>
      <button class="btn btn-p" id="b3n" onclick="ir(4)" disabled>${T('next')}</button>
    </div>`;

  // Paso 4
  document.getElementById('s4').innerHTML = `
    <h2>${T('s4t')}</h2>
    <p class="sub">${T('s4sub')}</p>
    <div class="inst" data-anim><div class="n">1</div><p>${T('s4i1')}</p></div>
    <div class="inst" data-anim><div class="n">2</div><p>${T('s4i2')}</p></div>
    <div class="email-box" id="email-box">…</div>
    <div class="inst" data-anim><div class="n">3</div><p>${T('s4i3')}</p></div>
    <label class="lbl">${T('sid')}</label>
    <input type="text" id="sheet-id" placeholder="1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgVE2upms">
    <p class="err" id="e4"></p>
    <div class="actions">
      <button class="btn btn-g" onclick="ir(3)">${T('back')}</button>
      <button class="btn btn-p" id="b4v" onclick="verificar()">
        <span id="vtxt">${T('verify')}</span>
      </button>
    </div>`;

  // Pantalla de éxito
  document.getElementById('done-t').textContent  = T('done_t');
  document.getElementById('done-s').textContent  = T('done_s');
  document.getElementById('btn-goto').textContent = T('go');
  document.getElementById('h-sub').textContent    = T('sub');
}

// ── Cambiar idioma ────────────────────────────────────────────────────────────
async function setLang(l) {
  LANG = l;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === l));
  await fetch('/api/lang', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({lang:l})}).catch(()=>{});
  // Guardar qué paso estaba activo
  const active = document.querySelector('.step.active');
  const activeId = active ? active.id : 's1';
  renderSteps();
  // Restaurar paso activo
  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
  document.getElementById(activeId).classList.add('active');
  // Reanimar instrucciones del paso actual
  if (activeId.startsWith('s') && activeId !== 's-done') {
    animateInstructions(activeId);
  }
}

// ── Animación de palabras ─────────────────────────────────────────────────────
function animateInstructions(stepId) {
  const step = document.getElementById(stepId);
  if (!step) return;
  step.querySelectorAll('[data-anim]').forEach(inst => {
    const p = inst.querySelector('p');
    if (!p || p.dataset.wrapped) return;
    p.dataset.wrapped = '1';
    const walker = document.createTreeWalker(p, NodeFilter.SHOW_TEXT);
    const nodes = [];
    let node;
    while ((node = walker.nextNode())) nodes.push(node);
    nodes.forEach(tn => {
      const parts = tn.textContent.split(/(\s+)/);
      const frag  = document.createDocumentFragment();
      parts.forEach(w => {
        if (/^\s+$/.test(w)) {
          frag.appendChild(document.createTextNode(w));
        } else if (w) {
          const sp = document.createElement('span');
          sp.className = 'iw';
          sp.textContent = w;
          frag.appendChild(sp);
        }
      });
      tn.replaceWith(frag);
    });
  });

  if (!window.anime) return;
  const spans = step.querySelectorAll('.iw');
  anime({
    targets: Array.from(spans),
    opacity: [0, 1],
    translateY: [6, 0],
    duration: 380,
    delay: anime.stagger(15, {start: 80}),
    easing: 'easeOutQuad',
  });
}

// ── Navegación ────────────────────────────────────────────────────────────────
function ir(n) {
  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
  document.getElementById(n <= 4 ? `s${n}` : 's-done').classList.add('active');
  for (let i = 1; i <= 4; i++) {
    const b = document.getElementById(`b${i}`);
    if (b) b.className = 's ' + (i < n ? 'done' : i === n ? 'active' : '');
  }
  if (n === 4) loadEmail();
  if (n <= 4) animateInstructions(`s${n}`);
}

async function loadEmail() {
  try {
    const {service_account_email} = await (await fetch('/api/setup/status')).json();
    const el = document.getElementById('email-box');
    if (el) {
      el.textContent = service_account_email || '—';
      el.style.color = service_account_email ? '' : '#f87171';
    }
  } catch(_) {}
}

// ── Upload ────────────────────────────────────────────────────────────────────
function dropF(e) {
  e.preventDefault();
  document.getElementById('drop').classList.remove('over');
  const f = e.dataTransfer.files[0];
  if (f) subir(f);
}

async function subir(file) {
  const err = document.getElementById('e3');
  if (!err) return;
  err.style.display = 'none';
  if (!file || !file.name.endsWith('.json')) {
    err.textContent = T('conn_err') || 'JSON requerido';
    err.style.display = 'block';
    return;
  }
  const form = new FormData();
  form.append('file', file);
  try {
    const r = await fetch('/api/setup/upload-credentials', {method:'POST', body:form});
    const d = await r.json();
    if (!r.ok) { err.textContent = d.detail || 'Error'; err.style.display = 'block'; return; }
    const drop = document.getElementById('drop');
    drop.classList.add('ok');
    const safeName = document.createTextNode(file.name);
    const pEl = document.createElement('p');
    pEl.appendChild(safeName);
    drop.innerHTML = '<div class="icon">✅</div>';
    drop.appendChild(pEl);
    const b3n = document.getElementById('b3n');
    if (b3n) b3n.disabled = false;
  } catch(_) {
    err.textContent = T('conn_err');
    err.style.display = 'block';
  }
}

async function verificar() {
  const sid = (document.getElementById('sheet-id')?.value || '').trim();
  const err = document.getElementById('e4');
  const btn = document.getElementById('b4v');
  const txt = document.getElementById('vtxt');
  if (!err || !btn || !txt) return;
  err.style.display = 'none';
  if (!sid) { err.textContent = T('sid') + ' requerido'; err.style.display = 'block'; return; }
  btn.disabled = true;
  txt.innerHTML = `<span class="spin"></span> ${T('verifying')}`;
  try {
    const r = await fetch('/api/setup/verify', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({spreadsheet_id: sid})
    });
    const d = await r.json();
    if (!r.ok) {
      err.textContent = d.detail || 'Error';
      err.style.display = 'block';
      btn.disabled = false;
      txt.textContent = T('verify');
      return;
    }
    ir(5);
  } catch(_) {
    err.textContent = T('conn_err');
    err.style.display = 'block';
    btn.disabled = false;
    txt.textContent = T('verify');
  }
}

// ── Init ──────────────────────────────────────────────────────────────────────
(async () => {
  try {
    const {lang} = await (await fetch('/api/setup/status')).json();
    if (lang && TX[lang]) LANG = lang;
  } catch(_) {}
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === LANG));
  renderSteps();
  setTimeout(() => animateInstructions('s1'), 450);
})();
</script>
