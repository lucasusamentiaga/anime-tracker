<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/static/icon.ico">
<title>Calendario — Miraru</title>
<style>
:root{--bg:#0f0f13;--card:#1a1a24;--border:#2a2a38;--fg:#e2e2e8;--muted:#6b6b88;--accent:#7c3aed;--light:#a78bfa;--card2:#12121a;--success:#34d399}
[data-theme=light]{--bg:#f8f7fc;--card:#fff;--border:#d4d0ec;--fg:#1e1e2e;--muted:#64648c;--light:#4f46e5;--accent:#4f46e5;--card2:#f0eef8;--success:#059669}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:"Segoe UI",system-ui,sans-serif;min-height:100vh}
header{background:var(--card);border-bottom:1px solid var(--border);padding:11px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
header h1{font-size:16px;font-weight:700;color:var(--light);flex:1}
/* v2.6.1: efecto neón en el título de la página (igual estética que el menú) */
header h1{
  text-shadow:
    0 0 4px rgba(183,148,255,.7),
    0 0 10px rgba(139,92,246,.45),
    0 0 22px rgba(124,58,237,.25),
    0 0 38px rgba(217,70,239,.18);
  animation:titleNeon 3.2s ease-in-out infinite alternate;
}
@keyframes titleNeon{
  from{text-shadow:0 0 4px rgba(183,148,255,.55),0 0 9px rgba(139,92,246,.35),0 0 18px rgba(124,58,237,.18),0 0 32px rgba(217,70,239,.12)}
  to  {text-shadow:0 0 6px rgba(183,148,255,.85),0 0 14px rgba(139,92,246,.6),0 0 28px rgba(124,58,237,.35),0 0 48px rgba(217,70,239,.25)}
}
@media (prefers-reduced-motion:reduce){header h1{animation:none}}
.back{background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--muted);padding:6px 14px;font-size:13px;text-decoration:none}
.back:hover{border-color:var(--accent);color:var(--light)}
[data-theme=light] header{background:#fff;border-color:#d4d0ec}
[data-theme=light] .back{background:#fff;color:#4b4b6b;border-color:#d4d0ec}
main{max-width:800px;margin:0 auto;padding:20px}
.day{margin-bottom:20px}
.day-header{font-size:14px;font-weight:700;color:var(--light);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.day-header .today{background:var(--accent);color:#fff;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:700}
.ep-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:12px;margin-bottom:6px}
.ep-card img{width:40px;height:56px;border-radius:6px;object-fit:cover;flex-shrink:0}
.ep-card .info{flex:1;min-width:0}
.ep-card .name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ep-card .meta{font-size:11px;color:var(--muted)}
.ep-card .time{font-size:12px;font-weight:700;color:var(--success);flex-shrink:0}
[data-theme=light] .ep-card{background:#fff;border-color:#d4d0ec}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty .icon{font-size:40px;margin-bottom:12px}
.spin{width:24px;height:24px;border:3px solid rgba(124,58,237,.2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{text-align:center;padding:50px;color:var(--muted)}
</style>
<!-- Sistema visual unificado (theme.css) -->
<link rel="stylesheet" href="/static/theme.css">
<script src="/static/customize.js"></script>
</head>
<body>
<header>
  <h1>📅 Calendario semanal</h1>
  <a href="/app" class="back">← Volver</a>
</header>
<main id="container">
  <div class="loading"><div class="spin"></div>Cargando calendario…</div>
</main>
<script>
try{if(localStorage.getItem('theme')==='light')document.documentElement.dataset.theme='light';}catch(_){}

function _thumbUrl(url) { return url ? url.replace('/cover/large/', '/cover/medium/') : ''; }
const DIAS_ES = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];

async function cargar() {
  const cont = document.getElementById('container');
  try {
    const r = await fetch('/api/calendario');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    if (!d.total) {
      cont.innerHTML = '<div class="empty"><div class="icon">📅</div><p>No hay episodios programados esta semana.</p><p style="font-size:12px;margin-top:8px;color:var(--muted)">Marca animes como "viendo" para ver su calendario aquí.</p></div>';
      return;
    }
    const frag = document.createDocumentFragment();
    // v2.3: fecha local, no UTC. `toISOString` daba el día UTC y el badge
    // "HOY" no aparecía en la celda correcta en zonas horarias negativas.
    const _today = new Date();
    const hoy = _today.getFullYear() + '-'
              + String(_today.getMonth() + 1).padStart(2, '0') + '-'
              + String(_today.getDate()).padStart(2, '0');

    // v2.4: recordatorio proactivo — si hoy sale algún episodio, banner arriba.
    const hoyEps = d.dias[hoy] || [];
    if (hoyEps.length) {
      const banner = document.createElement('div');
      banner.style.cssText = 'background:linear-gradient(135deg,rgba(124,58,237,.22),rgba(124,58,237,.08));' +
        'border:1px solid var(--accent);border-radius:12px;padding:14px 16px;margin-bottom:18px';
      const t = document.createElement('div');
      t.style.cssText = 'font-size:13px;font-weight:700;color:var(--light);margin-bottom:8px';
      t.textContent = '🔔 Hoy sale ' + (hoyEps.length === 1 ? '1 episodio' : hoyEps.length + ' episodios');
      banner.appendChild(t);
      hoyEps.forEach(ep => {
        const line = document.createElement('div');
        line.style.cssText = 'font-size:12px;color:var(--muted);padding:2px 0';
        line.textContent = '• Ep ' + ep.episodio + ' de ' + ep.nombre + (ep.hora ? ' · ' + ep.hora : '');
        banner.appendChild(line);
      });
      frag.appendChild(banner);
    }

    for (const [dayKey, eps] of Object.entries(d.dias)) {
      const dayDiv = document.createElement('div');
      dayDiv.className = 'day';
      const dt = new Date(dayKey + 'T12:00:00');
      const header = document.createElement('div');
      header.className = 'day-header';
      header.textContent = DIAS_ES[dt.getDay()] + ' ' + dt.getDate() + '/' + (dt.getMonth()+1);
      if (dayKey === hoy) {
        const badge = document.createElement('span');
        badge.className = 'today';
        badge.textContent = 'HOY';
        header.appendChild(badge);
      }
      dayDiv.appendChild(header);
      eps.forEach(ep => {
        const card = document.createElement('div');
        card.className = 'ep-card';
        const img = document.createElement('img');
        // src="" haría que el navegador se bajase esta misma página como imagen.
        if (ep.imagen) { img.src = _thumbUrl(ep.imagen); img.loading = 'lazy'; }
        else { img.style.display = 'none'; }
        img.alt = '';
        img.onerror = () => { img.style.display='none'; };
        const info = document.createElement('div');
        info.className = 'info';
        const name = document.createElement('div');
        name.className = 'name';
        name.textContent = ep.nombre;
        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = 'Episodio ' + ep.episodio + (ep.total_eps ? ' / ' + ep.total_eps : '');
        info.appendChild(name);
        info.appendChild(meta);
        const time = document.createElement('div');
        time.className = 'time';
        time.textContent = ep.hora || '';
        card.appendChild(img);
        card.appendChild(info);
        card.appendChild(time);
        dayDiv.appendChild(card);
      });
      frag.appendChild(dayDiv);
    }
    cont.innerHTML = '';
    cont.appendChild(frag);
  } catch(e) {
    // v2.3: DOM seguro (antes inyectaba e.message en innerHTML).
    cont.innerHTML = '';
    const eb = document.createElement('div');
    eb.className = 'empty';
    const ic = document.createElement('div');
    ic.className = 'icon';
    ic.textContent = '⚠️';
    const p = document.createElement('p');
    p.textContent = 'Error: ' + (e.message || '');
    eb.appendChild(ic); eb.appendChild(p);
    cont.appendChild(eb);
  }
}
cargar();
</script>
