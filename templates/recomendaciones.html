<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/static/icon.ico">
<title>Recomendaciones — Miraru</title>
<style>
:root{--bg:#0f0f13;--card:#1a1a24;--border:#2a2a38;--fg:#e2e2e8;--muted:#6b6b88;--accent:#7c3aed;--light:#a78bfa;--card2:#12121a;--success:#34d399}
[data-theme=light]{--bg:#f8f7fc;--card:#fff;--border:#d4d0ec;--fg:#1e1e2e;--muted:#64648c;--light:#4f46e5;--accent:#4f46e5;--card2:#f0eef8;--success:#059669}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:"Segoe UI",system-ui,sans-serif;min-height:100vh}
header{background:var(--card);border-bottom:1px solid var(--border);padding:11px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
header h1{font-size:16px;font-weight:700;color:var(--light);flex:1}
/* v2.6.1: efecto neón en el título de la página (igual estética que el menú) */
header h1{
  text-shadow:
    0 0 4px rgba(183,148,255,.7),
    0 0 10px rgba(139,92,246,.45),
    0 0 22px rgba(124,58,237,.25),
    0 0 38px rgba(217,70,239,.18);
  animation:titleNeon 3.2s ease-in-out infinite alternate;
}
@keyframes titleNeon{
  from{text-shadow:0 0 4px rgba(183,148,255,.55),0 0 9px rgba(139,92,246,.35),0 0 18px rgba(124,58,237,.18),0 0 32px rgba(217,70,239,.12)}
  to  {text-shadow:0 0 6px rgba(183,148,255,.85),0 0 14px rgba(139,92,246,.6),0 0 28px rgba(124,58,237,.35),0 0 48px rgba(217,70,239,.25)}
}
@media (prefers-reduced-motion:reduce){header h1{animation:none}}
.back{background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--muted);padding:6px 14px;font-size:13px;text-decoration:none}
.back:hover{border-color:var(--accent);color:var(--light)}
[data-theme=light] header{background:#fff;border-color:#d4d0ec}
[data-theme=light] .back{background:#fff;color:#4b4b6b;border-color:#d4d0ec}
main{max-width:900px;margin:0 auto;padding:20px}
.genre-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.genre-pill{background:rgba(124,58,237,.15);border:1px solid rgba(124,58,237,.25);border-radius:99px;padding:4px 12px;font-size:11px;color:var(--light);font-weight:600}
[data-theme=light] .genre-pill{background:#eef2ff;color:#4338ca;border-color:#c7d2fe}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.rc{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;transition:border-color .18s ease,box-shadow .18s ease;text-decoration:none;color:inherit}
.rc:hover{border-color:var(--accent);box-shadow:0 4px 16px rgba(0,0,0,.2)}
.rc .thumb{aspect-ratio:3/4;overflow:hidden}
.rc .thumb img{width:100%;height:100%;object-fit:cover}
.rc .info{padding:8px 10px}
.rc .name{font-size:11px;font-weight:600;line-height:1.3;margin-bottom:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rc .meta{font-size:10px;color:var(--muted)}
.rc .score{color:var(--light);font-weight:700}
[data-theme=light] .rc{background:#fff;border-color:#d4d0ec}
[data-theme=light] .rc:hover{border-color:#4f46e5}
.add-btn{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:4px 10px;font-size:10px;font-weight:600;cursor:pointer;margin-top:4px;width:100%;transition:background .18s ease}
.add-btn:hover{background:var(--accent2)}
.add-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.add-btn:disabled{opacity:.4}
.subtitle{font-size:12px;color:var(--muted);margin-bottom:16px}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.spin{width:24px;height:24px;border:3px solid rgba(124,58,237,.2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{text-align:center;padding:50px;color:var(--muted)}
#toast{position:fixed;top:16px;right:16px;z-index:100;opacity:0;pointer-events:none;transition:opacity .3s;max-width:300px}
#toast.show{opacity:1}
.toast-i{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-size:13px;font-weight:500;color:var(--success)}
</style>
<!-- Sistema visual unificado (theme.css) -->
<link rel="stylesheet" href="/static/theme.css">
<script src="/static/customize.js"></script>
<script src="/static/i18n-dom.js" defer></script>
</head>
<body>
<div id="toast"><div class="toast-i" id="toast-i"></div></div>
<header>
  <h1>💡 Recomendaciones para ti</h1>
  <a href="/app" class="back">← Volver</a>
</header>
<main>
  <!-- Para quien empieza en el anime -->
  <section id="beginner" style="margin-bottom:24px">
    <h2 style="font-size:16px;font-weight:800;color:var(--light);margin-bottom:4px">🌱 ¿Nuevo en el anime? Empieza por aquí</h2>
    <p style="font-size:12px;color:var(--muted);margin-bottom:14px">Títulos accesibles y muy queridos, perfectos como primer anime — ordenados según tus gustos.</p>
    <div id="beginner-hero"></div>
    <div class="grid" id="beginner-grid"></div>
  </section>
  <hr style="border:none;border-top:1px solid var(--border);margin:0 0 18px">

  <h2 style="font-size:16px;font-weight:800;color:var(--light);margin-bottom:6px">✨ Según tus gustos</h2>
  <p class="subtitle" id="sub"></p>
  <div class="genre-pills" id="pills"></div>
  <div id="container">
    <div class="loading"><div class="spin"></div>Buscando recomendaciones…</div>
  </div>
</main>
<script>
try{if(localStorage.getItem('theme')==='light')document.documentElement.dataset.theme='light';}catch(_){}

function toast(msg) {
  const el = document.getElementById('toast');
  document.getElementById('toast-i').textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 3000);
}

// Botón "+ Añadir a mi lista" reutilizable
function mkAdd(nombre) {
  const b = document.createElement('button');
  b.className = 'add-btn';
  b.textContent = '+ Añadir a mi lista';
  b.onclick = async (e) => {
    e.preventDefault(); e.stopPropagation();
    b.disabled = true; b.textContent = '...';
    try {
      const r = await fetch('/api/animes', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({nombre: nombre, fuente: 'anilist'})
      });
      if (r.ok || r.status === 409) {
        b.textContent = r.status === 409 ? '✓ Ya en tu lista' : '✓ Añadido';
        b.style.background = 'var(--success)';
        if (r.ok) toast('✓ ' + nombre + ' añadido');
        // Desvanecer la card tras un momento
        const card = b.closest('.rc');
        if (card) setTimeout(() => { card.style.transition = 'opacity .4s'; card.style.opacity = '0'; setTimeout(() => card.remove(), 400); }, 800);
      } else {
        const d = await r.json();
        b.textContent = d.detail || 'Error'; b.style.background = 'var(--muted)';
      }
    } catch(_) { b.textContent = 'Error'; }
  };
  return b;
}

// Portada con reserva. La implementación vive en customize.js (cargado en todas
// las páginas) para no tener dos copias que se desincronicen.
const ponerPortada = (img, url) => miraruPortada(img, url);

// Aviso cuando los datos vienen de una fuente de respaldo (AniList caído).
function pintarAviso(texto) {
  if (!texto) return;
  const zona = document.getElementById('beginner-hero') || document.getElementById('container');
  if (!zona || zona.dataset.avisoPuesto) return;
  zona.dataset.avisoPuesto = '1';
  const av = document.createElement('div');
  av.textContent = 'ℹ️ ' + texto;
  av.style.cssText = 'background:var(--card);border:1px solid var(--border);border-radius:10px;'
                   + 'padding:10px 12px;margin-bottom:14px;font-size:12px;color:var(--muted)';
  zona.prepend(av);
}

// Recomendaciones para principiantes: hero "empieza por aquí" + grid de puerta de entrada
async function cargarPrincipiante() {
  try {
    const r = await fetch('/api/recomendaciones/principiante');
    if (!r.ok) return;
    const d = await r.json();
    pintarAviso(d.aviso);
    const ea = d.empieza_aqui;
    // Si ya tienes todos los "puerta de entrada" en tu lista, no mostrar la sección vacía.
    const sec = document.getElementById('beginner');
    if (sec) sec.style.display = (ea || (d.recomendaciones || []).length) ? '' : 'none';
    const hero = document.getElementById('beginner-hero');
    if (hero && ea) {
      const wrap = document.createElement('div');
      wrap.style.cssText = 'display:flex;gap:14px;background:var(--card);border:1px solid var(--accent);border-radius:14px;padding:14px;margin-bottom:16px;box-shadow:0 8px 28px rgba(124,58,237,.18)';
      const img = document.createElement('img');
      ponerPortada(img, ea.imagen);
      img.style.cssText = 'width:90px;height:126px;object-fit:cover;border-radius:10px;flex-shrink:0;background:var(--card2)';
      const info = document.createElement('div'); info.style.cssText = 'flex:1;min-width:0';
      const badge = document.createElement('span');
      badge.textContent = '⭐ EMPIEZA POR AQUÍ';
      badge.style.cssText = 'display:inline-block;background:var(--accent);color:#fff;font-size:10px;font-weight:700;border-radius:99px;padding:2px 9px;margin-bottom:6px';
      const t = document.createElement('div'); t.textContent = ea.titulo;
      t.style.cssText = 'font-size:17px;font-weight:800;line-height:1.2;margin-bottom:5px';
      const why = document.createElement('div'); why.textContent = ea.motivo || '';
      why.style.cssText = 'font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:8px';
      const m = document.createElement('div');
      m.textContent = [ea.episodios ? ea.episodios + ' eps' : '', ea.puntuacion_global ? '⭐ ' + ea.puntuacion_global : ''].filter(Boolean).join(' · ');
      m.style.cssText = 'font-size:11px;color:var(--light);margin-bottom:8px';
      info.appendChild(badge); info.appendChild(t); info.appendChild(why); info.appendChild(m);
      info.appendChild(mkAdd(ea.titulo));
      wrap.appendChild(img); wrap.appendChild(info); hero.appendChild(wrap);
    }
    const grid = document.getElementById('beginner-grid');
    (d.recomendaciones || []).filter(a => !ea || a.id !== ea.id).forEach(a => {
      const card = document.createElement('div'); card.className = 'rc'; card.title = a.motivo || '';
      const thumb = document.createElement('div'); thumb.className = 'thumb';
      const img = document.createElement('img'); ponerPortada(img, a.imagen);
      thumb.appendChild(img);
      const info = document.createElement('div'); info.className = 'info';
      const name = document.createElement('div'); name.className = 'name'; name.textContent = a.titulo;
      const meta = document.createElement('div'); meta.className = 'meta';
      meta.textContent = [a.episodios ? a.episodios + ' eps' : '', a.puntuacion_global ? '⭐ ' + a.puntuacion_global : ''].filter(Boolean).join(' · ');
      info.appendChild(name); info.appendChild(meta); info.appendChild(mkAdd(a.titulo));
      card.appendChild(thumb); card.appendChild(info); grid.appendChild(card);
    });
  } catch(_) {}
}

async function cargar() {
  const cont = document.getElementById('container');
  try {
    const r = await fetch('/api/recomendaciones');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();

    // Genre pills
    const pills = document.getElementById('pills');
    (d.generos_base || []).forEach(g => {
      const p = document.createElement('span');
      p.className = 'genre-pill';
      p.textContent = g;
      pills.appendChild(p);
    });
    document.getElementById('sub').textContent =
      'Basado en tus ' + (d.generos_base || []).length + ' géneros más vistos · ' +
      (d.recomendaciones || []).length + ' animes sugeridos';

    pintarAviso(d.aviso);

    const items = d.recomendaciones || [];
    if (!items.length) {
      const vacio = document.createElement('div');
      vacio.className = 'empty';
      const p = document.createElement('p');
      // No echarle la culpa al usuario ("añade más animes") cuando en realidad
      // la fuente de datos está caída: el backend lo dice en `error`/`aviso`.
      p.textContent = d.error || d.aviso ||
        'Añade y puntúa más animes para obtener recomendaciones personalizadas.';
      vacio.appendChild(p);
      cont.innerHTML = '';
      cont.appendChild(vacio);
      return;
    }

    const grid = document.createElement('div');
    grid.className = 'grid';
    items.forEach(a => {
      const card = document.createElement('a');
      card.className = 'rc';
      card.href = a.link || '#';
      card.target = '_blank';
      card.rel = 'noopener';

      const thumb = document.createElement('div');
      thumb.className = 'thumb';
      const img = document.createElement('img');
      ponerPortada(img, a.imagen);
      thumb.appendChild(img);

      const info = document.createElement('div');
      info.className = 'info';
      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = a.nombre;
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = [a.episodios + ' eps', a.estado_anime].filter(Boolean).join(' · ');
      if (a.puntuacion_global) {
        const sc = document.createElement('span');
        sc.className = 'score';
        sc.textContent = ' ⭐ ' + a.puntuacion_global.toFixed(1);
        meta.appendChild(sc);
      }

      const addBtn = document.createElement('button');
      addBtn.className = 'add-btn';
      addBtn.textContent = '+ Añadir a mi lista';
      addBtn.onclick = async (e) => {
        e.preventDefault();
        e.stopPropagation();
        addBtn.disabled = true;
        addBtn.textContent = '...';
        try {
          const r2 = await fetch('/api/animes', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({nombre: a.nombre, fuente: 'anilist'})
          });
          if (r2.ok || r2.status === 409) {
            addBtn.textContent = r2.status === 409 ? '✓ Ya en tu lista' : '✓ Añadido';
            addBtn.style.background = 'var(--success)';
            if (r2.ok) toast('✓ ' + a.nombre + ' añadido');
            setTimeout(() => { card.style.transition = 'opacity .4s'; card.style.opacity = '0'; setTimeout(() => card.remove(), 400); }, 800);
          } else {
            const d2 = await r2.json();
            addBtn.textContent = d2.detail || 'Error';
            addBtn.style.background = 'var(--muted)';
          }
        } catch(_) { addBtn.textContent = 'Error'; }
      };

      info.appendChild(name);
      info.appendChild(meta);
      info.appendChild(addBtn);
      card.appendChild(thumb);
      card.appendChild(info);
      grid.appendChild(card);
    });
    cont.innerHTML = '';
    cont.appendChild(grid);
  } catch(e) {
    // v2.3: DOM seguro (e.message podría contener HTML/script)
    cont.innerHTML = '';
    const eb = document.createElement('div');
    eb.className = 'empty';
    const p  = document.createElement('p');
    p.textContent = 'Error: ' + (e.message || '');
    eb.appendChild(p);
    cont.appendChild(eb);
  }
}
cargarPrincipiante();
cargar();

// Refrescar al volver con bfcache (back/forward) para que los añadidos desaparezcan
window.addEventListener('pageshow', (e) => {
  if (e.persisted) {
    document.getElementById('beginner-hero').innerHTML = '';
    document.getElementById('beginner-grid').innerHTML = '';
    document.getElementById('container').innerHTML = '<div class="loading"><div class="spin"></div>Actualizando…</div>';
    cargarPrincipiante();
    cargar();
  }
});
</script>
