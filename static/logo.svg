<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Miraru">
  <title>Miraru</title>
  <defs>
    <linearGradient id="miraruGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
    <radialGradient id="miraruHi" cx="0.32" cy="0.24" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Disco de marca -->
  <circle cx="256" cy="256" r="252" fill="url(#miraruGrad)"/>
  <circle cx="256" cy="256" r="252" fill="url(#miraruHi)"/>

  <!-- Arco de progreso: el "seguimiento" de lo que ves -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="#ffffff" stroke-opacity="0.9"
          stroke-width="16" stroke-linecap="round"
          stroke-dasharray="710 1232" transform="rotate(-108 256 256)"/>

  <!-- Play: el acto de ver (anime, series, cine) -->
  <path d="M214 182 L214 330 L348 256 Z" fill="#ffffff"
        stroke="#ffffff" stroke-width="22" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
