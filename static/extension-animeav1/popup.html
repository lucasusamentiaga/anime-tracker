<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="estilo.css">
</head>
<body class="popup">
  <div class="cab">
    <img src="iconos/48.png" alt="">
    <div><b>Miraru × AnimeAV1</b><small>Episodios vistos, al instante</small></div>
    <span class="pastilla" id="pastilla"><i></i><span id="pastilla-txt">…</span></span>
  </div>
  <div class="cuerpo">
    <div class="aviso mal" id="cerrado" hidden>Miraru está cerrado. Ábrelo y lo que marques se apuntará solo.</div>
    <div class="aviso warn" id="pendientes" hidden></div>
    <div class="aviso warn" id="fallo" hidden></div>

    <div class="ultimo" id="ultimo" hidden>
      <img id="u-img" alt="">
      <div class="t">
        <div class="etq" id="u-etq">✓ Apuntado en Miraru</div>
        <div class="n" id="u-nombre"></div>
        <div class="e" id="u-ep"></div>
        <div class="barra"><span id="u-barra"></span></div>
        <div class="e" id="u-cuando" style="margin-top:4px"></div>
      </div>
    </div>
    <div class="vacio" id="vacio">
      <span class="m-btn m-ojo">👁</span>
      <span>Abre un episodio en AnimeAV1 y pulsa <b>«Marcar como visto»</b>: aparecerá aquí y en Miraru.</span>
    </div>

    <div class="hist" id="hist" hidden><h3>Antes</h3></div>

    <div class="fila">
      <a class="btn" id="abrir" href="#" target="_blank">Abrir Miraru</a>
      <button class="btn sec" id="reintentar" hidden>Enviar ahora</button>
      <button class="btn sec" id="guia">Guía</button>
    </div>
    <details><summary>Ajustes</summary>
      <p>Puerto de Miraru: <input id="puerto" type="number" min="1" max="65535"> <span>(normalmente 8765)</span></p>
    </details>
  </div>
<script src="popup.js"></script>
</body>
</html>
